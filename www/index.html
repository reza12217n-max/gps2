<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#047857">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>نقشه زمین</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></symbol>
<symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 6l3 3"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.6"/><rect x="14" y="4" width="6" height="6" rx="1.6"/><rect x="4" y="14" width="6" height="6" rx="1.6"/><rect x="14" y="14" width="6" height="6" rx="1.6"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h10a5 5 0 010 10H8M4 9l4-4M4 9l4 4"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-polygon" viewBox="0 0 24 24"><path d="M5 8l7-4 7 5-2 9H7z"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 4v16M4 12h16"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5l10 7-10 7zM19 5v14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5l2-2v6h-6l2.3-2.3A5 5 0 007 12M20 12a8 8 0 01-14 5"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 2L5 21l7-4.5L19 21z" style="fill:currentColor"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></symbol>
<symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 000-6H9a3 3 0 010-6h7"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18M12 11v7M9 15l3 3 3-3"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
<symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 16L16 3l5 5L8 21zM7 12l2 2M10 9l2 2M13 6l2 2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-1a4 4 0 00-4-4H7a4 4 0 00-4 4v1M9.5 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM21 20v-1a4 4 0 00-3-3.9M16 4.1a3.5 3.5 0 010 6.8"/></symbol>
<symbol id="i-road" viewBox="0 0 24 24"><path d="M8 3L5 21M16 3l3 18M12 4v3M12 11v3M12 18v3"/></symbol>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M3.5 10l8.5-5.5 9 4-1.5 9-12 .5z" style="fill:#fff;stroke:#fff"/><path d="M12 4.5v14" style="stroke:#047857;stroke-dasharray:2 2"/></symbol>
</defs></svg>

<div id="app">
 <canvas id="map"></canvas>
 <div id="appbar">
  <button class="round" data-a="menu" aria-label="منو"><svg class="ic"><use href="#i-menu"/></svg></button>
  <div id="titlePill" data-a="lands"><b id="landName"></b><small id="landSub"></small></div>
  <div id="gps" class="chip">GPS ...</div>
 </div>
 <div id="tools">
  <button class="round tgl" data-a="toolsToggle" aria-label="ابزارها"><svg class="ic"><use href="#i-tools"/></svg></button>
  <button class="round t-item" data-a="me" aria-label="موقعیت من"><svg class="ic"><use href="#i-locate"/></svg></button>
  <button class="round t-item" data-a="fit" aria-label="کل زمین"><svg class="ic"><use href="#i-expand"/></svg></button>
  <button class="round t-item" data-a="mapType" aria-label="نوع نقشه"><svg class="ic"><use href="#i-layers"/></svg></button>
  <button class="round t-item" data-a="manual" id="btnManual" aria-label="انتخاب دستی"><svg class="ic"><use href="#i-hand"/></svg></button>
  <button class="round t-item" data-a="ins" id="btnIns" aria-label="افزودن نقطه بین نقاط"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button class="round t-item" data-a="str" id="btnStr" aria-label="صاف‌سازی بین دو نقطه"><svg class="ic"><use href="#i-route"/></svg></button>
 </div>
 <div id="modeBar" class="hidden"></div>
 <div id="toast" class="hidden"></div>
 <div id="chips"></div>
 <div id="tgtBar" class="bar hidden"></div>
 <div id="draftBar" class="bar low hidden"><div id="dText"></div><div class="bb"><button class="ok" data-a="dOk"><svg class="ic"><use href="#i-check"/></svg>ثبت</button><button data-a="dNo">لغو</button></div></div>
 <div id="stakeBar" class="bar low hidden"><div class="sthead"><svg id="stArrow" class="ic arrow"><use href="#i-nav"/></svg><div id="stTxt"></div></div><div class="bb"><button class="ok" id="stOk" data-a="stDone"><svg class="ic"><use href="#i-check"/></svg>میخ زدم</button><button data-a="stSkip"><svg class="ic"><use href="#i-skip"/></svg>رد کن</button><button data-a="stEnd"><svg class="ic"><use href="#i-stop"/></svg>پایان</button></div></div>
 <div id="dock"></div>
</div>

<div id="scrim" class="hidden" data-a="closeSheet"></div>
<div id="modal"><div class="grab"></div><div class="sheetHead"><b id="mTitle"></b><button class="round sm" data-a="closeSheet" aria-label="بستن"><svg class="ic"><use href="#i-close"/></svg></button></div><div id="mBody"></div></div>
<div id="dlg" class="ov hidden"><div class="box"><div id="dMsg"></div><input id="dInp"><div class="btns"><button id="dYes" class="btn"></button><button id="dNo" class="btn gray"></button></div></div></div>
<div id="perm" class="ov hidden"><div class="box"><h3>اجازه‌ی موقعیت مکانی</h3><div id="pMsg">برای ثبت نقطه‌های زمین، برنامه به GPS گوشی نیاز داره.</div><div class="btns"><button class="btn" id="pBtn" data-a="askPerm">اجازه بده</button><button class="btn gray hidden" id="pSkip" data-a="permSkip">ادامه با دقت کم</button></div></div></div>
<div id="viewer" class="ov hidden" data-a="viewerClose"><img id="viewerImg" alt=""></div>
<div id="intro" class="hidden"></div>
<div id="splash"><div class="logo"><svg class="ic"><use href="#i-logo"/></svg></div><b>نقشه زمین</b><small>برداشت، تقسیم و میخ‌کوبی</small></div>
<input type="file" id="imp" accept=".json,.kml,.geojson,.dxf,application/json" class="hidden">
<input type="file" id="photo" accept="image/*" class="hidden">
<script src="geo.js"></script>
<script src="exp.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="ui.js"></script>
</body>
</html>
